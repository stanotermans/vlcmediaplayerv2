name: Android

# Vela Player for Android (#53): the app for the emulator (x86_64) and for phones (arm64-v8a), tried in an Android 14
# emulator that plays a test video, and the app bundle for Google Play (.aab, signed with the upload key from the
# ANDROID_UPLOAD_KEYSTORE / ANDROID_UPLOAD_PASS secrets; "android-bundle" under the run's artifacts). Nothing goes to
# GitHub releases: the app goes out through Google Play. Upload number: "Run workflow" asks for it (version code).
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Upload number for this version (raises the version code: 0, 1, 2, …)'
        default: '0'
  push:
    branches: [android]     # (work in progress on the Android version)

env:
  QT_VERSION: 6.8.3
  NDK_VERSION: 26.1.10909125

jobs:
  # the slim FFmpeg (app/build/ffmpeg/build.sh), built with the NDK: thumbnails, lengths and tracks of the library
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        target: [android-x64, android-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg/out/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/build/ffmpeg/*.sh', 'app/build/ffmpeg/patches/**') }}
      - name: Build with the NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq nasm pkgconf meson ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" bash app/build/ffmpeg/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: { name: 'ffmpeg-${{ matrix.target }}', path: 'app/build/ffmpeg/out/${{ matrix.target }}/', if-no-files-found: error }

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Ninja and the NDK
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Qt for the build machine
        uses: jurplel/install-qt-action@v4
        with: { version: '${{ env.QT_VERSION }}', host: linux, target: desktop, arch: linux_gcc_64, modules: qtmultimedia qtshadertools, cache: true }
      - run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          host: all_os            # (Qt 6.7+ publishes its Android builds for every host)
          target: android
          arch: ${{ matrix.abi == 'x86_64' && 'android_x86_64' || 'android_arm64_v8a' }}
          modules: qtmultimedia qtshadertools
          cache: true
      - uses: actions/download-artifact@v4
        with: { name: "ffmpeg-${{ matrix.abi == 'x86_64' && 'android-x64' || 'android-arm64' }}", path: ffbin }
      - name: Build the APK
        run: bash qt/packaging/android/build.sh ${{ matrix.abi }} "$QT_ROOT_DIR" ffbin/ffmpeg apk
      - uses: actions/upload-artifact@v4
        with: { name: 'android-${{ matrix.abi }}', path: 'apk/*.apk', if-no-files-found: error }

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-x86_64, path: apk }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: A test video
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=640x360:r=25:d=12 -f lavfi -i sine=f=440:d=12 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest video.mp4
      - name: Play it in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash qt/packaging/android/emutest.sh "$(ls apk/*.apk | head -1)" video.mp4 emu-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-emulator, path: emu-out/ }

  bundle:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Ninja and the NDK
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Qt for the build machine
        uses: jurplel/install-qt-action@v4
        with: { version: '${{ env.QT_VERSION }}', host: linux, target: desktop, arch: linux_gcc_64, modules: qtmultimedia qtshadertools, cache: true }
      - run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Qt for Android
        uses: jurplel/install-qt-action@v4
        with: { version: '${{ env.QT_VERSION }}', host: all_os, target: android, arch: android_arm64_v8a, modules: qtmultimedia qtshadertools, cache: true }
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-android-arm64, path: ffbin }
      - name: The app bundle for Google Play
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          APK_KEYSTORE_PASS: ${{ secrets.ANDROID_UPLOAD_PASS }}
          ANDROID_BUILD: ${{ inputs.build || '0' }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          FORMAT=aab APK_KEYSTORE="$RUNNER_TEMP/upload.p12" bash qt/packaging/android/build.sh arm64-v8a "$QT_ROOT_DIR" ffbin/ffmpeg bundle
          rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with: { name: android-bundle, path: 'bundle/*.aab', if-no-files-found: error }
