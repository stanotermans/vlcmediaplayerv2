name: Build & Release

# Builds the app for Windows, macOS (Apple Silicon + Intel) and Linux.
#  - Manually: "Actions" tab → "Build & Release" → "Run workflow" (files appear under "Artifacts").
#  - Release:  push a tag that matches the version in app/package.json, e.g.
#                git tag v1.5.0 && git push origin v1.5.0
#              A GitHub Release with a download table per operating system is then created automatically.
on:
  workflow_dispatch:
  push:
    tags: ['v*', '!v3.*']   # v3 (Qt) has its own workflow: qt.yml

jobs:
  # Slim ffmpeg (see app/build/ffmpeg/build.sh). Cached until the build script changes.
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64,   os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: mac-arm64, os: macos-14 }
          - { target: mac-x64,   os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg/out/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/build/ffmpeg/*.sh', 'app/build/ffmpeg/patches/**') }}
      - name: Build in Docker
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: bash app/build/ffmpeg/docker.sh ${{ matrix.target }}
      - name: Build on macOS
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install nasm pkgconf meson ninja
          bash app/build/ffmpeg/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: app/build/ffmpeg/out/${{ matrix.target }}/
          if-no-files-found: error

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # Windows is signed through SignPath below; macOS is not signed
      # Windows signing (see CODE_SIGNING.md) only runs once the SignPath secret is set in the repository
      SIGN_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match version v$V in app/package.json"; exit 1; fi

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - run: npm ci

      # API keys from repository secrets, packaged with the app but never committed (app/keys.json is git-ignored)
      - name: API keys
        shell: bash
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('keys.json', JSON.stringify({ opensubtitles: process.env.OPENSUBTITLES_API_KEY || '' }))"
          node -e "console.log('OpenSubtitles key present:', !!require('./keys.json').opensubtitles)"

      # Swap the large ffmpeg-static binary for the slim build
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: ffbin
      - name: Use slim ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cp ../ffbin/ffmpeg-win-x64/ffmpeg.exe node_modules/ffmpeg-static/ffmpeg.exe ;;
            Linux)   cp ../ffbin/ffmpeg-linux-x64/ffmpeg node_modules/ffmpeg-static/ffmpeg ;;
            macOS)   cp ../ffbin/ffmpeg-mac-arm64/ffmpeg node_modules/ffmpeg-static/ffmpeg ;;
          esac
          chmod +x node_modules/ffmpeg-static/ffmpeg* && ls -l node_modules/ffmpeg-static/

      # VLC playback engine: libVLC and the native module that connects it to the app (scripts/vlc-smoke.js checks
      # that they play). Windows and macOS: VideoLAN's official builds, checked against VideoLAN's SHA-256 and trimmed.
      # Linux: build/vlc-linux (Debian's libVLC with a slim FFmpeg), in every Linux package.
      - name: libVLC and the vlcview module (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/fetch-vlc.js
          npx --yes node-gyp@12 rebuild -C native/vlcview --arch=x64
          node scripts/vlc-smoke.js
      - name: libVLC and the vlcview module (Linux)
        if: runner.os == 'Linux'
        run: |
          bash build/vlc-linux/docker.sh
          sudo chown -R "$(id -u):$(id -g)" vendor native/vlcview
          node scripts/vlc-smoke.js

      # Windows in two signing rounds: first the app itself (so the installed .exe is signed),
      # then the installer and portable .exe that wrap it.
      - name: Windows app folder
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --publish never
      - id: unsigned-app
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-win-app
          path: app/dist/win-unpacked/
      - name: Sign app (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vlcmediaplayerv2
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app/dist/win-signed
      - name: Use signed app
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        run: rm -rf dist/win-unpacked && mv dist/win-signed dist/win-unpacked
      - name: Windows (installer, portable, Microsoft Store)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable appx --prepackaged dist/win-unpacked --publish never
      - id: unsigned-installers
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-win-installers
          path: app/dist/*.exe
      - name: Sign installers (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vlcmediaplayerv2
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app/dist

      - name: macOS Apple Silicon
        if: runner.os == 'macOS'
        run: |
          node scripts/fetch-vlc.js mac-arm64
          npx --yes node-gyp@12 rebuild -C native/vlcview --arch=arm64
          node scripts/vlc-smoke.js
          npx electron-builder --mac --arm64 --publish never
      - name: macOS Intel (with Intel FFmpeg and libVLC)
        if: runner.os == 'macOS'
        run: |
          cp ../ffbin/ffmpeg-mac-x64/ffmpeg node_modules/ffmpeg-static/ffmpeg && chmod +x node_modules/ffmpeg-static/ffmpeg
          node scripts/fetch-vlc.js mac-x64
          npx --yes node-gyp@12 rebuild -C native/vlcview --arch=x64
          npx electron-builder --mac --x64 --publish never

      - name: Linux (AppImage, deb, rpm, pacman, tar.gz)
        if: runner.os == 'Linux'
        run: |
          # productName without a space: the packages install to /opt/<productName>, and Chromium's fallback
          # sandbox (used where user namespaces are blocked, e.g. Ubuntu 24.04) cuts paths at spaces
          npx electron-builder --linux deb rpm pacman tar.gz -c.productName=vlc-redesign --publish never
          # AppImage with gzip instead of xz: AppImageHub and older AppImage runtimes cannot mount xz
          npx electron-builder --linux AppImage -c.compression=normal -c.productName=vlc-redesign --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.appx
            app/dist/*.dmg
            app/dist/*-mac-*.zip
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/*.pacman
            app/dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vlc-*
          path: artifacts
          merge-multiple: true
      - name: Release notes with download table
        run: |
          V="${GITHUB_REF_NAME#v}"
          B="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          f() { ls artifacts | grep -E "$1" | head -1; }
          link() { n=$(f "$1"); if [ -n "$n" ]; then echo "[\`$n\`]($B/$n)"; else echo "—"; fi; }
          sed -e "s|{{VERSION}}|$V|g" \
              -e "s|{{WIN_SETUP}}|$(link 'Setup-.*\.exe$')|" \
              -e "s|{{WIN_PORTABLE}}|$(link 'Portable-.*\.exe$')|" \
              -e "s|{{WIN_STORE}}|$(link '\.appx$')|" \
              -e "s|{{MAC_ARM}}|$(link 'mac-arm64\.dmg$')|" \
              -e "s|{{MAC_X64}}|$(link 'mac-x64\.dmg$')|" \
              -e "s|{{DEB}}|$(link '\.deb$')|" \
              -e "s|{{RPM}}|$(link '\.rpm$')|" \
              -e "s|{{PACMAN}}|$(link '\.pacman$')|" \
              -e "s|{{APPIMAGE}}|$(link '\.AppImage$')|" \
              -e "s|{{TARGZ}}|$(link '\.tar\.gz$')|" \
              .github/release-template.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: VLC Redesign ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
