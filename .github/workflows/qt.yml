name: Qt build (v3)

# Builds VLC Redesign 3 (Qt/QML + libVLC, qt/) for Windows, macOS (Apple Silicon + Intel) and Linux, packages it
# (qt/packaging/*/package.sh), plays a test video and sound with each package (qt/packaging/smoke.py) and runs the
# test suite on it (qt/tests).
#  - By hand: "Actions" tab → "Qt build (v3)" → "Run workflow"; the packages appear under "Artifacts".
#  - Release: push a tag that matches the version in qt/CMakeLists.txt, e.g. git tag v3.0.0 && git push origin v3.0.0
#    A GitHub Release with the packages and a download table is then made (notes: qt/packaging/release-notes.md).
# v2.x (Electron, app/) keeps its own workflow (build.yml) and releases.
on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  # the slim FFmpeg, as in build.yml (same cache)
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64,   os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: mac-arm64, os: macos-14 }
          - { target: mac-x64,   os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/build/ffmpeg/out/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('app/build/ffmpeg/*.sh', 'app/build/ffmpeg/patches/**') }}
      - name: Build in Docker
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: bash app/build/ffmpeg/docker.sh ${{ matrix.target }}
      - name: Build on macOS
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install nasm pkgconf
          bash app/build/ffmpeg/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: app/build/ffmpeg/out/${{ matrix.target }}/
          if-no-files-found: error

  # the test media (qt/tests/make-media.sh needs a full FFmpeg: Ubuntu's)
  testmedia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          bash qt/tests/make-media.sh testdata
      - uses: actions/upload-artifact@v4
        with: { name: testmedia, path: testdata/, if-no-files-found: error }

  windows:
    needs: [ffmpeg, testmedia]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(sed -n 's/^project(vlcredesign3 VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match version v$V in qt/CMakeLists.txt"; exit 1; fi
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-win-x64, path: ffbin }
      - name: libVLC (VideoLAN's build, checked and trimmed)
        working-directory: app
        run: node scripts/fetch-vlc.js
      - name: API keys (from secrets, never committed)
        shell: bash
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('qt/keys.json', JSON.stringify({ opensubtitles: process.env.OPENSUBTITLES_API_KEY || '' }))"
      - name: Build
        shell: bash
        run: |
          cmake -S qt -B qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build
      - name: NSIS (the installer)
        run: choco install nsis -y --no-progress
      - name: Package (installer, portable)
        shell: bash
        run: bash qt/packaging/windows/package.sh "$GITHUB_WORKSPACE/ffbin/ffmpeg.exe" "$GITHUB_WORKSPACE/qt/dist"
      - name: Smoke test
        run: python qt/packaging/smoke.py "qt/deploy/VLC Redesign/VLC Redesign.exe"
      - uses: actions/download-artifact@v4
        with: { name: testmedia, path: testdata }
      - name: Tests
        run: python qt/tests/run.py "qt/deploy/VLC Redesign/VLC Redesign.exe" testdata --out test-out
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: tests-windows, path: test-out/ }
      - uses: actions/upload-artifact@v4
        with:
          name: vlc3-windows
          if-no-files-found: error
          path: |
            qt/dist/*Setup-*.exe
            qt/dist/*.zip

  macos:
    needs: [ffmpeg, testmedia]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true
      - run: brew install ninja
      - uses: actions/download-artifact@v4
        with: { name: 'ffmpeg-mac-${{ matrix.arch }}', path: ffbin }
      - name: libVLC (VideoLAN's build for this processor)
        working-directory: app
        run: node scripts/fetch-vlc.js mac-${{ matrix.arch }}
      - name: API keys
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('qt/keys.json', JSON.stringify({ opensubtitles: process.env.OPENSUBTITLES_API_KEY || '' }))"
      - name: Build and package (app, dmg)
        run: bash qt/packaging/macos/package.sh ${{ matrix.arch }} "$GITHUB_WORKSPACE/ffbin/ffmpeg" "$GITHUB_WORKSPACE/qt/dist"
      - name: Smoke test
        if: matrix.arch == 'arm64'   # the runner is Apple Silicon; the Intel build is only packaged
        run: python3 qt/packaging/smoke.py "qt/build-mac-arm64/VLC Redesign.app/Contents/MacOS/VLC Redesign"
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'arm64'
        with: { name: testmedia, path: testdata }
      - name: Tests
        if: matrix.arch == 'arm64'
        run: python3 qt/tests/run.py "qt/build-mac-arm64/VLC Redesign.app/Contents/MacOS/VLC Redesign" testdata --out test-out
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.arch == 'arm64'
        with: { name: tests-macos, path: test-out/ }
      - uses: actions/upload-artifact@v4
        with:
          name: vlc3-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: qt/dist/*.dmg

  linux:
    needs: [ffmpeg, testmedia]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and X11 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libfuse2 xvfb \
            libpulse0 libasound2 libfontconfig1 file
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools qtimageformats'
          cache: true
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-linux-x64, path: ffbin }
      - name: libVLC (build/vlc-linux, in Docker)
        run: |
          bash app/build/vlc-linux/docker.sh
          sudo chown -R "$(id -u):$(id -g)" app/vendor app/native/vlcview
      - name: API keys
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('qt/keys.json', JSON.stringify({ opensubtitles: process.env.OPENSUBTITLES_API_KEY || '' }))"
      - name: Build and package (AppImage, deb, rpm, Arch, tar.gz)
        run: bash qt/packaging/linux/package.sh "$GITHUB_WORKSPACE/ffbin/ffmpeg" "$GITHUB_WORKSPACE/qt/dist"
      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 qt/packaging/smoke.py qt/build-linux/AppDir/AppRun
      - uses: actions/download-artifact@v4
        with: { name: testmedia, path: testdata }
      - name: Tests
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 qt/tests/run.py qt/build-linux/AppDir/AppRun testdata --out test-out
      - name: libVLC for the Flatpak
        run: tar -C app/vendor -czf vlc-linux.tgz vlc
      - uses: actions/upload-artifact@v4
        with: { name: libvlc-linux, path: vlc-linux.tgz, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: tests-linux, path: test-out/ }
      - uses: actions/upload-artifact@v4
        with:
          name: vlc3-linux
          if-no-files-found: error
          path: |
            qt/dist/*.AppImage
            qt/dist/*.deb
            qt/dist/*.rpm
            qt/dist/*.pkg.tar.zst
            qt/dist/*.tar.gz

  # the Flatpak (#54): built in Flathub's own build container (KDE SDK and flatpak-builder inside), then installed on
  # a plain Ubuntu and tested there like the other packages
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ffmpeg-linux-x64, path: ffbin }
      - uses: actions/download-artifact@v4
        with: { name: libvlc-linux, path: . }
      - name: API keys
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: printf '{"opensubtitles":"%s"}' "${OPENSUBTITLES_API_KEY:-}" > qt/keys.json
      - name: Build the Flatpak
        run: |
          tar -xzf vlc-linux.tgz && chmod +x ffbin/ffmpeg
          bash qt/packaging/flatpak/package.sh ffbin/ffmpeg vlc qt/dist
      - uses: actions/upload-artifact@v4
        with: { name: vlc3-flatpak, path: qt/dist/*.flatpak, if-no-files-found: error }

  flatpak-test:
    needs: [flatpak, testmedia]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: vlc3-flatpak, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: testmedia, path: testdata }
      - name: Install (KDE's runtime comes from Flathub)
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak xvfb dbus
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive dist/*.flatpak
      - name: Smoke test and tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"; export TMPDIR="$GITHUB_WORKSPACE/tmp"   # the sandbox does not see the host's /tmp
          [ -n "${XDG_RUNTIME_DIR:-}" ] || { export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p -m 700 "$XDG_RUNTIME_DIR"; }
          # flatpak run needs a session bus
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 qt/packaging/smoke.py qt/packaging/flatpak/run.sh
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 qt/tests/run.py qt/packaging/flatpak/run.sh testdata --out test-out
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: tests-flatpak, path: test-out/ }

  release:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: [windows, macos, linux, flatpak-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vlc3-*
          path: artifacts
          merge-multiple: true
      - name: Release notes with download table
        run: |
          V="${GITHUB_REF_NAME#v}"
          B="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          f() { ls artifacts | grep -E "$1" | head -1; }
          link() { n=$(f "$1"); if [ -n "$n" ]; then echo "[\`$n\`]($B/$n)"; else echo "—"; fi; }
          sed -e "s|{{VERSION}}|$V|g"               -e "s|{{WIN_SETUP}}|$(link 'Setup-.*\.exe$')|"               -e "s|{{WIN_PORTABLE}}|$(link 'Portable-.*\.zip$')|"               -e "s|{{MAC_ARM}}|$(link 'mac-arm64\.dmg$')|"               -e "s|{{MAC_X64}}|$(link 'mac-x64\.dmg$')|"               -e "s|{{DEB}}|$(link '\.deb$')|"               -e "s|{{RPM}}|$(link '\.rpm$')|"               -e "s|{{PACMAN}}|$(link '\.pkg\.tar\.zst$')|"               -e "s|{{APPIMAGE}}|$(link '\.AppImage$')|"               -e "s|{{TARGZ}}|$(link '\.tar\.gz$')|" -e "s|{{FLATPAK}}|$(link '\.flatpak$')|"               qt/packaging/release-notes.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: VLC Redesign ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
