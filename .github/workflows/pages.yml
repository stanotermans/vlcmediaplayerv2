# The website (docs/) and the Flatpak repository (#54) on GitHub Pages:
#   flatpak install https://stanotermans.github.io/vlcmediaplayerv2/flatpak/vlc-redesign.flatpakref
# after which `flatpak update` brings new versions. The repository is rebuilt from the latest release's .flatpak and
# signed with the FLATPAK_GPG_PRIVATE_KEY secret. Runs on site changes, by hand, and from qt.yml after each release.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ID: io.github.stanotermans.VLCRedesign
  URL: https://stanotermans.github.io/vlcmediaplayerv2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak tools
        run: sudo apt-get update -q && sudo apt-get install -yq flatpak ostree
      - name: The latest release's .flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".flatpak")))][0].tag_name')
          echo "release $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.flatpak' --dir bundle
      - name: Signed repository
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          K=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          S="--gpg-sign=$K --gpg-homedir=$GNUPGHOME"
          mkdir -p site/flatpak; cp -a docs/. site/
          R=site/flatpak/repo
          ostree init --mode=archive-z2 --repo=$R
          flatpak build-import-bundle $S $R bundle/*.flatpak
          flatpak build-update-repo $S --title="VLC Redesign" --default-branch=master --generate-static-deltas --prune $R
          G=$(gpg --export "$K" | base64 -w0)
          gpg --export --armor "$K" > site/flatpak/vlc-redesign.gpg
          printf '%s\n' '[Flatpak Repo]' 'Title=VLC Redesign' "Url=$URL/flatpak/repo/" "Homepage=$URL/" \
            'Comment=VLC Redesign, the media player with the design of Juxtopposed' "Icon=$URL/icon.png" "GPGKey=$G" \
            > site/flatpak/vlc-redesign.flatpakrepo
          printf '%s\n' '[Flatpak Ref]' "Name=$ID" 'Branch=master' 'Title=VLC Redesign' "Url=$URL/flatpak/repo/" \
            "Homepage=$URL/" "Icon=$URL/icon.png" 'IsRuntime=false' 'SuggestRemoteName=vlc-redesign' \
            'RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo' "GPGKey=$G" \
            > site/flatpak/vlc-redesign.flatpakref
          flatpak repo $R
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # installs it the way the README says, from the live site
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Flatpak
        run: sudo apt-get update -q && sudo apt-get install -yq flatpak
      - name: Install from the repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive "$URL/flatpak/vlc-redesign.flatpakref"
          flatpak info --user "$ID"
          flatpak remotes --user --show-details
          flatpak update --user -y --noninteractive
