name: ♿ Accessibility barrier
description: Something in the app is hard or impossible to use
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the app usable for everyone. Accessibility problems are treated as bugs.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology
      description: For example NVDA, JAWS, VoiceOver, Orca, keyboard only, screen magnifier, high contrast. Leave empty if none.
  - type: input
    id: env
    attributes:
      label: Operating system and app version
      placeholder: Windows 11, v1.3.0
    validations:
      required: true
