name: 💡 Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for your idea! Ideas that fit the original design by Juxtopposed have the best chance.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I watch a series, I always have to …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, screenshots or examples from other apps.
